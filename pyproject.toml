[project]
name = "intura-ai"
dynamic = ["version"]
description = "Python client for the Intura AI API: prompt-injection screening, PII masking, phishing and chat-scam detection, chat intent, KTP/NPWP document checks, and model downloads for self-hosting."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10,<3.14"
authors = [{ name = "Intura", email = "developer@intura.co" }]
keywords = [
    "guardrails",
    "prompt-injection",
    "pii",
    "redaction",
    "phishing",
    "fraud-detection",
    "intent-classification",
    "kyc",
    "ktp",
    "indonesia",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
    "Topic :: Text Processing :: Linguistic",
    "Natural Language :: Indonesian",
    "Natural Language :: English",
    "Typing :: Typed",
]

# One dependency, and it is the HTTP client. There are no extras and no optional
# runtimes any more: the models run in the service, so nothing here needs ONNX,
# a tokenizer, OpenCV or 250 MB of weights. A guardrail that has to be installed
# before it can be evaluated does not get evaluated.
#
# httpx rather than requests because both clients come out of one dependency —
# the async one matters most here, since these calls sit on a request path in
# front of a model call.
dependencies = [
    "httpx>=0.27,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[project.scripts]
intura-ai = "intura_ai._cli:main"

[project.urls]
Homepage = "https://ai.intura.co"
Documentation = "https://ai.intura.co/docs"
Repository = "https://github.com/intura-co/intura-ai"
"Bug Tracker" = "https://github.com/intura-co/intura-ai/issues"
Console = "https://ai.intura.co/console"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "intura_ai/__version__.py"

[tool.hatch.build.targets.wheel]
packages = ["intura_ai"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
# Every test in this suite runs against `httpx.MockTransport`. Nothing reaches
# the network, so a fresh clone runs green offline and CI is never one outage
# away from red — and the assertions are about the request this package builds,
# which is the part it is responsible for.
asyncio_mode = "auto"
